server {
    listen 80;
    server_name _;

    # Proxy API + health check to the backend service (compose network name).
    location /api/ {
        proxy_pass http://backend:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /health {
        proxy_pass http://backend:8077;
    }

    # Single-page app: serve files, fall back to index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
