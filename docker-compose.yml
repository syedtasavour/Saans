# Saans - full stack in two containers.
#   backend : FastAPI + SQLite + cron (daily air-quality refresh)
#   frontend: nginx serving the built React app, proxying /api to the backend
#
# Start everything:   docker compose up --build
# Then open:          http://localhost:5173
#
# The OpenAQ key (for live stations + historical ingest) is read from a .env
# file next to this one, as:  openAq=<your key>
services:
  backend:
    build: ./backend
    environment:
      - openAq=${openAq:-}
    volumes:
      - tracker-data:/app/data
    ports:
      - "8077:8077"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  tracker-data:
